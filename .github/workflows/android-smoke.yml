name: Android smoke

on:
  push:
    branches: [master, "ralph/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  instrumentation-smoke:
    name: API 29 instrumentation smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Report emulator acceleration
        run: |
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo "KVM acceleration available"
          else
            echo "KVM unavailable; using the lightweight API 29 AOSP smoke image"
          fi
      - name: Build Rust core for packaged ABIs
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add aarch64-linux-android x86_64-linux-android
          sdkmanager "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export CC_aarch64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export AR_aarch64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
          export CC_x86_64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
          export AR_x86_64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo build -p offline-yt-core --target aarch64-linux-android
          cargo build -p offline-yt-core --target x86_64-linux-android
      - name: Run device-side smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          # Keep this acceleration tier intentionally small while extending it with deterministic
          # Compose goldens. The smoke set proves instrumentation health, packaged Rust/UniFFI
          # runtime loading, platform runtime paths, behavioral Compose coverage, the deterministic
          # RMD-1500 Add/Share -> Analyze -> Download Setup -> scheduling UI pipeline, RMD-1403
          # exact-raster screenshot regression coverage, and RMD-508 Android connectivity mapping.
          script: >-
            sh -c 'mkdir -p app/build/reports/androidSmokeLogs;
            status=0;
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ekkus.offlineytplayer.AndroidRuntimeSmokeTest,com.ekkus.offlineytplayer.coregateway.GeneratedUniffiCoreGatewaySmokeTest,com.ekkus.offlineytplayer.NetworkCapabilityInstrumentedTest,com.ekkus.offlineytplayer.downloads.DownloadForegroundTimeoutInstrumentedTest,com.ekkus.offlineytplayer.downloads.DownloadNotificationPermissionInstrumentedTest,com.ekkus.offlineytplayer.downloads.NotificationPermissionStateInstrumentationTest,com.ekkus.offlineytplayer.downloads.DownloadConnectivityObserverInstrumentedTest,com.ekkus.offlineytplayer.downloads.Rmd1501AndroidRuntimeFixtureInstrumentedTest,com.ekkus.offlineytplayer.downloads.Rmd1502SplitAvOfflineInstrumentedTest,com.ekkus.offlineytplayer.downloads.Rmd1503SubtitleOfflineInstrumentedTest,com.ekkus.offlineytplayer.Rmd1504ShareE2EInstrumentedTest,com.ekkus.offlineytplayer.Rmd1802SettingsObserverInstrumentedTest,com.ekkus.offlineytplayer.downloads.Rmd1505StorageFailureInstrumentedTest,com.ekkus.offlineytplayer.downloads.Rmd1506ConnectivityE2EInstrumentedTest,com.ekkus.offlineytplayer.downloads.Rmd1507NotificationControlInstrumentedTest,com.ekkus.offlineytplayer.playback.PlaybackSessionBehaviorInstrumentedTest,com.ekkus.offlineytplayer.ui.ProductionComposeBehaviorTest,com.ekkus.offlineytplayer.ui.LifecycleStateRestorationComposeTest,com.ekkus.offlineytplayer.ui.MainActivityQueryRecreationInstrumentedTest,com.ekkus.offlineytplayer.ui.Rmd1500AppPipelineFixtureTest > app/build/reports/androidSmokeLogs/base-smoke-gradle.log 2>&1 || status=$?;
            if [ "$status" -ne 0 ]; then echo "Base smoke Gradle log:"; cat app/build/reports/androidSmokeLogs/base-smoke-gradle.log || true; echo "Base smoke failure summary:"; python3 scripts/summarize_android_test_failures.py || true; fi;
            if [ "$status" -eq 0 ]; then python3 scripts/assert_android_smoke_execution.py --results-dir app/build/outputs/androidTest-results/connected --required-class com.ekkus.offlineytplayer.Rmd1802SettingsObserverInstrumentedTest --required-test com.ekkus.offlineytplayer.Rmd1802SettingsObserverInstrumentedTest#backgroundStoreUpdatePublishesAppearanceToComposeOnMainThread || status=$?; fi;
            if [ "$status" -eq 0 ]; then sh scripts/run_required_android_smoke.sh || status=$?; fi;
            python3 scripts/register_download_setup_golden_variant.py || exit $?;
            git diff --exit-code -- app/src/androidTest/java/com/ekkus/offlineytplayer/ui/ProductionComposeGoldenTest.kt || exit $?;
            golden_status=0;
            rm -rf app/build/outputs/androidTest-results/connected;
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest > app/build/reports/androidSmokeLogs/golden-gradle.log 2>&1 || golden_status=$?;
            if [ "$golden_status" -eq 0 ]; then python3 scripts/assert_android_smoke_execution.py --results-dir app/build/outputs/androidTest-results/connected --required-class com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_library_empty --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_library_populated --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_add_invalid --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_add_resolved --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_download_setup_options --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_downloads_active --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_downloads_failure --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_player --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_settings_hub --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_smallest_supported_portrait --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_large_font_library --required-test com.ekkus.offlineytplayer.ui.ProductionComposeGoldenTest#golden_large_font_settings || golden_status=$?; fi;
            mkdir -p app/build/reports/androidGoldens;
            if ! adb pull /sdcard/Android/data/com.ekkus.offlineytplayer/files/goldens/. app/build/reports/androidGoldens/ > app/build/reports/androidSmokeLogs/golden-pull.log 2>&1; then adb pull /sdcard/Download/offline-yt-player-goldens/. app/build/reports/androidGoldens/ >> app/build/reports/androidSmokeLogs/golden-pull.log 2>&1 || true; fi;
            echo "Golden raster SHA-256 manifest:";
            cat app/build/reports/androidGoldens/golden-raster-sha256.txt || true;
            if [ "$golden_status" -ne 0 ]; then echo "Golden Gradle log:"; cat app/build/reports/androidSmokeLogs/golden-gradle.log || true; echo "Golden failure summary:"; python3 scripts/summarize_android_test_failures.py || true; status=$golden_status; fi;
            layout_status=0;
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ekkus.offlineytplayer.ui.ProductionComposeLayoutAccessibilityTest > app/build/reports/androidSmokeLogs/layout-accessibility-gradle.log 2>&1 || layout_status=$?;
            if [ "$layout_status" -ne 0 ]; then echo "Layout/accessibility Gradle log:"; cat app/build/reports/androidSmokeLogs/layout-accessibility-gradle.log || true; echo "Layout/accessibility failure summary:"; python3 scripts/summarize_android_test_failures.py || true; status=$layout_status; fi;
            exit $status'
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence-${{ github.run_id }}
          path: |
            app/build/reports/androidTests
            app/build/reports/androidGoldens
            app/build/reports/androidSmokeLogs
            app/build/outputs/androidTest-results
            app/build/outputs/managed_device_android_test_additional_output
          if-no-files-found: ignore
          retention-days: 7
