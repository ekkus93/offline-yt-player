name: Remediation Closeout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detailed-todo-complete:
    name: Detailed remediation TODO complete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify detailed remediation checklist
        run: python3 scripts/check_remediation_closeout.py
