name: Android runtime qualification

on:
  push:
    branches: [master, "ralph/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-capability:
    name: Network capability emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run packaged network capability instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ekkus.offlineytplayer.NetworkCapabilityInstrumentedTest
      - name: Upload runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-failure-evidence-${{ github.run_id }}-${{ github.job }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
