name: CI

on:
  push:
    branches: [master, "ralph/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Remediation governance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Closeout guard tests
        run: python3 -m unittest tests/test_check_remediation_closeout.py

  rust:
    name: Rust fmt clippy test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Upload Rust failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-failure-evidence-${{ github.run_id }}-${{ github.job }}
          path: |
            target/debug/deps
            target/debug/.fingerprint
            target/aarch64-linux-android/debug/deps
            target/aarch64-linux-android/debug/.fingerprint
          if-no-files-found: ignore
          retention-days: 7

  ffi:
    name: UniFFI Kotlin and Android ABI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add aarch64-linux-android
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;30.0.16248370"
      - name: Verify generated Kotlin bindings
        run: ./gradlew --no-daemon :app:verifyUniffiKotlinBindings
      - name: Build representative Android ABI
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/30.0.16248370
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CC_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          AR_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build -p offline-yt-core --target aarch64-linux-android
          test -f target/aarch64-linux-android/debug/liboffline_yt_core.so
      - name: Verify APK packages Rust core
        run: |
          ./gradlew --no-daemon assembleDebug
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-files.txt
          grep -F "lib/arm64-v8a/liboffline_yt_core.so" apk-files.txt
      - name: Upload UniFFI/APK failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-apk-failure-evidence-${{ github.run_id }}-${{ github.job }}
          path: |
            apk-files.txt
            target/uniffi-kotlin
            app/build/reports
            app/build/test-results
            app/build/outputs/apk/debug
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android lint unit build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install pinned Rust Android native library
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add aarch64-linux-android
          sdkmanager "ndk;30.0.16248370"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export CC_aarch64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export AR_aarch64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo build -p offline-yt-core --target aarch64-linux-android
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Gradle version
        run: ./gradlew --version
      - name: Android qualification
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Upload Android failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-evidence-${{ github.run_id }}-${{ github.job }}
          path: |
            app/build/reports
            app/build/test-results
            app/build/outputs/apk/debug
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
