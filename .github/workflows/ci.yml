name: CI

on:
  push:
    branches: [master, "ralph/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt clippy test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  ffi:
    name: UniFFI Kotlin and Android ABI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add aarch64-linux-android
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;30.0.16248370"
      - name: Generate Kotlin bindings
        run: |
          cargo build -p offline-yt-core
          rm -rf target/uniffi-kotlin
          cargo run -p uniffi-bindgen -- \
            generate target/debug/liboffline_yt_core.so \
            --language kotlin \
            --out-dir target/uniffi-kotlin
          test -n "$(find target/uniffi-kotlin -type f -name '*.kt' -print -quit)"
          grep -R "package com.ekkus.offlineytplayer.core" target/uniffi-kotlin
      - name: Build representative Android ABI
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/30.0.16248370
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CC_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          AR_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build -p offline-yt-core --target aarch64-linux-android
          test -f target/aarch64-linux-android/debug/liboffline_yt_core.so

  android:
    name: Android lint unit build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Gradle version
        run: ./gradlew --version
      - name: Android qualification
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
