name: CI

on:
  push:
    branches: [master, "ralph/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt clippy test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  android:
    name: Android lint unit build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Gradle version
        run: ./gradlew --version
      - name: Android qualification
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
