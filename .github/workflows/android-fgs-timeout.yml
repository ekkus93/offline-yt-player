name: Android FGS timeout

on:
  push:
    branches: [master, "ralph/**"]
    tags: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-fgs-timeout-${{ github.sha }}
  cancel-in-progress: true

jobs:
  api35-fgs-timeout:
    name: API 35 timeout-store and UIDT checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Build Rust core for packaged ABIs
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add aarch64-linux-android x86_64-linux-android
          sdkmanager "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export CC_aarch64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export AR_aarch64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
          export CC_x86_64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
          export AR_x86_64_linux_android=/usr/local/lib/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo build -p offline-yt-core --target aarch64-linux-android
          cargo build -p offline-yt-core --target x86_64-linux-android
      - name: Prebuild Android instrumentation APKs before emulator startup
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run API 35 timeout-store and UIDT checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: aosp_atd
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          # Software-emulated API 35 may signal boot completion before ADB properties respond.
          # Wait for a readable SDK property before Gradle enumerates instrumentation devices.
          script: bash scripts/run_android_fgs_uidt_qualification.sh
      - name: Print failed Android instrumentation assertions
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("app/build/outputs/androidTest-results/connected")
          files = sorted(root.rglob("*.xml")) if root.exists() else []
          print(f"Android instrumentation XML reports: {len(files)}")
          shown = 0
          for path in files:
              try:
                  tree = ET.parse(path)
              except ET.ParseError as error:
                  print(f"Malformed report {path}: {error}")
                  continue
              for case in tree.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      if shown >= 30:
                          break
                      shown += 1
                      name = f"{case.get('classname', '')}#{case.get('name', '')}"
                      print(f"FAILED {name} in {path}")
                      print((failure.get("message") or failure.text or "")[:1800])
          if not files:
              print("No instrumentation XML available; failure may be setup or Gradle infrastructure.")
          elif shown == 0:
              print("No test assertion failures found in XML; inspect setup or Gradle task failure.")
          PY
      - name: Upload timeout qualification evidence
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: android-fgs-timeout-evidence-${{ github.run_id }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/managed_device_android_test_additional_output
          if-no-files-found: ignore
          retention-days: 7
